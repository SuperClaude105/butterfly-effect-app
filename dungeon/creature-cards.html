<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creature Compendium — The Unwritten Table</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --elevated: #1a1a26;
    --border: rgba(255,255,255,0.07);
    --text: #e8e0d4;
    --dim: #8a8070;
    --gold: #c4a264;
    --easy: #4ade80;
    --medium: #fbbf24;
    --hard: #f97316;
    --legendary: #c084fc;
    --easy-bg: rgba(74,222,128,0.08);
    --medium-bg: rgba(251,191,36,0.08);
    --hard-bg: rgba(249,115,22,0.08);
    --legendary-bg: rgba(192,132,252,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

  /* Header */
  .site-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .brand { font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--gold); letter-spacing: 0.04em; }
  .sep { color: var(--dim); font-size: 0.8rem; }
  .page-title { font-family: 'Cinzel', serif; font-size: 0.95rem; color: var(--text); opacity: 0.7; }
  .back-link { margin-left: auto; color: var(--dim); font-size: 0.8rem; text-decoration: none; transition: color 0.2s; }
  .back-link:hover { color: var(--gold); }

  /* Controls */
  .controls {
    padding: 24px 32px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    background: var(--bg);
    position: sticky;
    top: 60px;
    z-index: 90;
    border-bottom: 1px solid var(--border);
  }
  .search-wrap { position: relative; flex: 1; min-width: 220px; max-width: 340px; }
  .search-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px 9px 38px;
    color: var(--text);
    font-size: 0.875rem;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: rgba(196,162,100,0.35); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 0.9rem; pointer-events: none; }

  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn {
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--dim);
    font-size: 0.78rem;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .filter-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }
  .filter-btn.active { color: var(--bg); font-weight: 600; }
  .filter-btn[data-tier="all"].active { background: var(--gold); border-color: var(--gold); }
  .filter-btn[data-tier="easy"].active { background: var(--easy); border-color: var(--easy); }
  .filter-btn[data-tier="medium"].active { background: var(--medium); border-color: var(--medium); }
  .filter-btn[data-tier="hard"].active { background: var(--hard); border-color: var(--hard); }
  .filter-btn[data-tier="legendary"].active { background: var(--legendary); border-color: var(--legendary); }

  .count-badge {
    margin-left: auto;
    color: var(--dim);
    font-size: 0.8rem;
    white-space: nowrap;
  }

  /* Type filter pills */
  .type-filters { padding: 12px 32px; display: flex; gap: 6px; flex-wrap: wrap; }
  .type-pill {
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--dim);
    font-size: 0.72rem;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.18s;
  }
  .type-pill:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
  .type-pill.active { background: rgba(196,162,100,0.12); border-color: rgba(196,162,100,0.35); color: var(--gold); }

  /* Grid */
  .grid-wrap { padding: 20px 32px 40px; }
  .creature-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
  }
  .card:hover { transform: translateY(-2px); border-color: rgba(196,162,100,0.2); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  .card.expanded { border-color: rgba(196,162,100,0.3); }
  .card[data-tier="easy"] { --tier-c: var(--easy); --tier-bg: var(--easy-bg); }
  .card[data-tier="medium"] { --tier-c: var(--medium); --tier-bg: var(--medium-bg); }
  .card[data-tier="hard"] { --tier-c: var(--hard); --tier-bg: var(--hard-bg); }
  .card[data-tier="legendary"] { --tier-c: var(--legendary); --tier-bg: var(--legendary-bg); }

  .card-top { display: flex; align-items: center; gap: 14px; padding: 16px; }
  .avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--tier-bg);
    border: 1.5px solid var(--tier-c);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem;
    flex-shrink: 0;
    box-shadow: 0 0 16px color-mix(in srgb, var(--tier-c) 25%, transparent);
  }
  .card-meta { flex: 1; min-width: 0; }
  .card-name { font-family: 'Cinzel', serif; font-size: 0.95rem; color: var(--text); line-height: 1.2; }
  .card-sub { font-size: 0.72rem; color: var(--dim); margin-top: 2px; }
  .cr-badge {
    flex-shrink: 0;
    background: var(--tier-bg);
    border: 1px solid var(--tier-c);
    color: var(--tier-c);
    font-size: 0.7rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    font-family: 'Inter', sans-serif;
  }

  .card-stats {
    display: flex;
    gap: 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .stat-chip {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    border-right: 1px solid var(--border);
  }
  .stat-chip:last-child { border-right: none; }
  .stat-label { font-size: 0.6rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-val { font-size: 0.88rem; color: var(--text); font-weight: 500; margin-top: 1px; }

  .card-footer { padding: 10px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tier-tag {
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--tier-c);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .env-tag {
    font-size: 0.65rem;
    padding: 2px 7px;
    border-radius: 3px;
    background: rgba(255,255,255,0.04);
    color: var(--dim);
    border: 1px solid var(--border);
  }
  .expand-icon { margin-left: auto; color: var(--dim); font-size: 0.75rem; transition: transform 0.2s; }
  .card.expanded .expand-icon { transform: rotate(180deg); }

  /* Expanded detail */
  .card-detail {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--border);
  }
  .card.expanded .card-detail { display: block; }
  .detail-desc { font-size: 0.8rem; color: var(--dim); line-height: 1.6; padding: 12px 0 10px; }

  .detail-section { margin-top: 10px; }
  .detail-head { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 6px; font-weight: 600; }
  .detail-row { font-size: 0.78rem; color: var(--text); line-height: 1.6; }
  .detail-row + .detail-row { margin-top: 4px; }
  .trait-name { color: var(--gold); font-weight: 500; }

  .stat-block-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
    margin-top: 6px;
  }
  .sb-cell { background: rgba(255,255,255,0.03); border-radius: 4px; text-align: center; padding: 6px 2px; }
  .sb-key { font-size: 0.58rem; text-transform: uppercase; color: var(--dim); letter-spacing: 0.08em; }
  .sb-score { font-size: 0.82rem; color: var(--text); font-weight: 500; }
  .sb-mod { font-size: 0.6rem; color: var(--dim); }

  .tactics-box {
    margin-top: 10px;
    padding: 8px 12px;
    background: rgba(196,162,100,0.06);
    border-left: 2px solid var(--gold);
    border-radius: 0 4px 4px 0;
    font-size: 0.78rem;
    color: var(--dim);
    line-height: 1.6;
  }

  /* Empty state */
  .empty { text-align: center; padding: 80px 20px; color: var(--dim); font-size: 0.9rem; }

  @media (max-width: 640px) {
    .controls { padding: 16px; }
    .type-filters { padding: 10px 16px; }
    .grid-wrap { padding: 16px; }
    .creature-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="site-header">
  <span class="brand">The Unwritten Table</span>
  <span class="sep">›</span>
  <span class="page-title">Creature Compendium</span>
  <a href="index.html" class="back-link">← Back to Lobby</a>
</header>

<div class="controls">

    <span class="search-icon">⌕</span>

  <div class="filter-group">

</div>

<div class="type-filters" id="typeFilters"></div>

<div class="grid-wrap">
  <div class="creature-grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none">No creatures match your search.</div>
</div>

// ─────────────────────────────────────────────
// UI
// ─────────────────────────────────────────────

const ALL_TYPES = [...new Set(CREATURES.map(c => c.type))].sort();
let activeTier = 'all';
let activeType = 'all';
let searchTerm = '';

function mod(score) {
  const m = Math.floor((score - 10) / 2);
  return (m >= 0 ? '+' : '') + m;
}

function renderTypeFilters() {
  const wrap = document.getElementById('typeFilters');
  wrap.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'type-pill active';
  allBtn.dataset.type = 'all';
  allBtn.textContent = 'All Types';
  allBtn.onclick = () => setType('all');
  wrap.appendChild(allBtn);
  ALL_TYPES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'type-pill';
    btn.dataset.type = t;
    btn.textContent = t;
    btn.onclick = () => setType(t);
    wrap.appendChild(btn);
  });
}

function setType(t) {
  activeType = t;
  document.querySelectorAll('.type-pill').forEach(b => {
    b.classList.toggle('active', b.dataset.type === t);
  });
  render();
}

function filtered() {
  return CREATURES.filter(c => {
    const tierOk = activeTier === 'all' || c.tier === activeTier;
    const typeOk = activeType === 'all' || c.type === activeType;
    const searchOk = !searchTerm || c.name.toLowerCase().includes(searchTerm) ||
      c.type.toLowerCase().includes(searchTerm) || c.desc.toLowerCase().includes(searchTerm) ||
      (c.environments||[]).some(e => e.includes(searchTerm));
    return tierOk && typeOk && searchOk;
  });
}

function buildCard(c) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.tier = c.tier;
  card.dataset.id = c.id;

  const envTags = (c.environments || []).slice(0, 3)
    .map(e => `<span class="env-tag">${e}</span>`).join('');

  const statBlock = ['str','dex','con','int','wis','cha'].map(k => `
    <div class="sb-cell">
      <div class="sb-key">${k.toUpperCase()}</div>
      <div class="sb-score">${c[k]}</div>
      <div class="sb-mod">${mod(c[k])}</div>
    </div>`).join('');

  const traits = (c.traits || []).map(t => {
    const colon = t.indexOf(':');
    if (colon > -1) {
      return `<div class="detail-row"><span class="trait-name">${t.slice(0,colon)}</span>${t.slice(colon)}</div>`;
    }
    return `<div class="detail-row">${t}</div>`;
  }).join('');

  const attacks = (c.attacks || []).map(a => `<div class="detail-row">${a}</div>`).join('');

  card.innerHTML = `
    <div class="card-top">
      <div class="avatar">${c.icon}</div>
      <div class="card-meta">
        <div class="card-name">${c.name}</div>
        <div class="card-sub">${c.type}${c.subtype ? ' · ' + c.subtype : ''}</div>
      </div>
      <div class="cr-badge">CR ${c.cr}</div>
    </div>
    <div class="card-stats">
      <div class="stat-chip"><div class="stat-label">HP</div><div class="stat-val">${c.hp}</div></div>
      <div class="stat-chip"><div class="stat-label">AC</div><div class="stat-val">${c.ac}</div></div>
      <div class="stat-chip"><div class="stat-label">Speed</div><div class="stat-val">${(c.speed||'30 ft.').split(',')[0]}</div></div>
      <div class="stat-chip"><div class="stat-label">XP</div><div class="stat-val">${(c.xp||0).toLocaleString()}</div></div>
    </div>
    <div class="card-footer">
      <span class="tier-tag">${c.tier}</span>
      ${envTags}
      <span class="expand-icon">▼</span>
    </div>
    <div class="card-detail">
      <div class="detail-desc">${c.desc}</div>
      <div class="stat-block-grid">${statBlock}</div>
      ${traits ? `<div class="detail-section"><div class="detail-head">Traits & Abilities</div>${traits}</div>` : ''}
      ${attacks ? `<div class="detail-section"><div class="detail-head">Attacks</div>${attacks}</div>` : ''}
      <div class="tactics-box"><strong style="color:var(--gold)">Tactics:</strong> ${c.tactics}</div>
    </div>`;

  card.querySelector('.card-top, .card-footer').addEventListener('click', () => {});
  card.addEventListener('click', () => {
    card.classList.toggle('expanded');
  });

  return card;
}

function render() {
  const list = filtered();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  grid.innerHTML = '';
  if (list.length === 0) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    list.forEach(c => grid.appendChild(buildCard(c)));
  }
  document.getElementById('countBadge').textContent = `${list.length} creature${list.length !== 1 ? 's' : ''}`;
}

// Tier filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTier = btn.dataset.tier;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase().trim();
  render();
});

renderTypeFilters();
render();
</script>
